<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<title>Runman</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="shortcut icon" href="#">
<link rel="stylesheet" href="./style.css" />

<body>
  <div id="stage">
    <div id="start-menu">
        <canvas class="biglogo"></canvas>
        <div class="description">
            <div>Code and Music by Clark McEvoy</div>
            <div>Press SPACE to jump</div>
            <div>SPACE + SPACE to double jump</div>
            <div>DOWN ARROW to fall out of a platform</div>
        </div>
        <canvas id="press-enter"></canvas>
    </div>
    <div id="game-over">
        <canvas class="blackscreen"></canvas>
        <canvas class="gameovermessage"></canvas>
        <div id="return">ESC -> Return to main menu</div>
        <div id="score">Score <span id="scorespan">0</span></div>
        <canvas id="overpress"></canvas>
    </div>
    <canvas id="game-board">
    </canvas>
  </div>
    <script src="./script.js" type="module"></script>
</body>

</html>
